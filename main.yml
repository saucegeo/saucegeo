name: Update Github Stats

on:
  schedule:
    - cron: "*/5 * * * *" # Every 5 minutes
  workflow_dispatch:

  # Add permission to access secrets
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # don't save access token

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run stats script
        run: python stats_cards.py
        env:
          GHT: ${{ secrets.GHT }}
      
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}
      
      - name: Commit and push changes
        run: |
          git config --global user.name "saucegeo-stats"
          git config --global user.email "saucegeo-stats@users.noreply.github.com"
          git add .
          git commit -m "Updated GitHub stats 🎉" || echo "No changes"
          git push https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git HEAD:main